<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body class="dashboard-page">
<header class="topbar">
    <a class="brand brand-dark" href="/user/profile">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 4.5 6.3v8.6L12 19.2l7.5-4.3V6.3L12 2Zm0 3.1 4.8 2.7-4.8 2.8-4.8-2.8L12 5.1Zm-5 5.4 3.5 2v3.9l-3.5-2v-3.9Zm6.5 5.9v-3.9l3.5-2v3.9l-3.5 2Z"/></svg></span>
        <span>Nimbus</span>
    </a>
    <button id="logout" class="logout-button" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17v2H5V5h5v2h2V3H3v18h9v-4h-2Zm11-5-4-4v3H9v2h8v3l4-4Z"/></svg><span>Đăng xuất</span></button>
</header>
<main class="dashboard-shell">
    <section class="welcome-row">
        <div><span class="eyebrow">Tổng quan tài khoản</span><h1>Xin chào, <span id="welcomeName">bạn</span>!</h1><p>Đây là thông tin hồ sơ và trạng thái tài khoản của bạn.</p></div>
    </section>
    <section id="profileContent" class="profile-grid">
        <article class="profile-card identity-card">
            <div class="cover-pattern"></div>
            <div class="identity-content">
                <div class="avatar-wrap"><img id="images" src="/images/default.png" alt="Ảnh đại diện"><span class="online-dot" title="Đang hoạt động"></span></div>
                <div id="profile" class="profile-name">Người dùng</div>
                <div id="profileEmail" class="profile-email"></div>
            </div>
        </article>
        <article class="profile-card details-card">
            <div class="card-heading">
                <div><span class="eyebrow">Thông tin cá nhân</span><h2>Chi tiết hồ sơ</h2></div>
                <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14Z"/></svg></span>
            </div>
            <dl class="details-list">
                <div class="detail-item"><dt>Họ và tên</dt><dd id="detailName">—</dd></div>
                <div class="detail-item"><dt>Địa chỉ email</dt><dd id="detailEmail">—</dd></div>
                <div class="detail-item"><dt>Mã người dùng</dt><dd id="detailId">—</dd></div>
                <div class="detail-item"><dt>Ngày tham gia</dt><dd id="detailCreated">—</dd></div>
            </dl>
        </article>
    </section>
</main>
<script th:src="@{/js/mainjs.js}" src="/js/mainjs.js"></script>
</body>
</html>
